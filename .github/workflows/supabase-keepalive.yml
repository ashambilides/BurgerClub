name: Supabase Keepalive

# Pings the Supabase REST API on a schedule so the free-tier project
# does not auto-pause after 7 days of inactivity.
# Runs Mon/Wed/Fri at 14:00 UTC (max 2-day gap, well under the 7-day pause threshold).

on:
  schedule:
    - cron: '0 14 * * 1,3,5'
  workflow_dispatch:  # allows manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit Supabase REST endpoint
        env:
          SUPABASE_URL: https://yezihsgtccwitfwgwudv.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_QL9pwpFDUqF5QHhSytvVmQ_Jkv3JvQU
        run: |
          # A paused/cold free-tier project can miss the first request while it wakes,
          # so retry with backoff and treat any eventual 2xx as success. A single-shot
          # ping would false-report failure precisely when the project needed waking.
          url="$SUPABASE_URL/rest/v1/results?select=id&limit=1"
          attempts=5
          delay=15
          for i in $(seq 1 $attempts); do
            status=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 30               "$url" -H "apikey: $SUPABASE_ANON_KEY" || echo 000)
            echo "Attempt $i/$attempts: HTTP $status"
            if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
              echo "Keepalive ping OK"
              cat /tmp/body
              exit 0
            fi
            echo "Not up yet (status $status) - project may be waking; retrying in ${delay}s"
            cat /tmp/body 2>/dev/null || true
            [ "$i" -lt "$attempts" ] && sleep $delay
          done
          echo "Keepalive ping failed after $attempts attempts"
          exit 1
